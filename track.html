<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Home Collection — Vanaja Diagnostic Centre</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<style>
.track-flow { display:flex; align-items:center; gap:0; overflow-x:auto; padding:1.4rem .2rem; }
.tnode { display:flex; flex-direction:column; align-items:center; gap:.45rem; min-width:96px; text-align:center; }
.tnode .bubble { width:44px;height:44px;border-radius:50%; display:grid;place-items:center; font-weight:800;
  background:var(--surface-2); color:var(--ink-faint); border:2px solid var(--border); }
.tnode.done .bubble { background:var(--grad-navy); color:#fff; border-color:transparent; box-shadow:var(--glow-navy); }
.tnode.now .bubble { background:var(--grad-accent); color:#fff; border-color:transparent; box-shadow:var(--glow-maroon); animation:pulse 1.8s infinite; }
.tnode span { font-size:.72rem; font-weight:700; max-width:90px; }
.tlink { height:3px; flex:1; min-width:24px; background:var(--border); border-radius:2px; margin-bottom:1.35rem; }
.tlink.done { background:var(--grad-navy); }
</style>
</head>
<body>
<div id="chrome-header"></div>

<main class="container section" style="padding-top:1.6rem">
  <div class="eyebrow">Home Sample Collection</div>
  <h1>Live Tracking</h1>
  <p id="bkMeta" style="color:var(--ink-muted)"></p>

  <div class="card">
    <div class="track-flow" id="flow"></div>
    <div class="disclaimer" style="margin-top:.6rem">Status updates in real time as the phlebotomist progresses. You'll get WhatsApp &amp; SMS alerts at each stage.</div>
  </div>

  <div class="grid grid-2" style="margin-top:1.2rem">
    <div class="card">
      <h3>Collector</h3>
      <div style="display:flex;gap:.9rem;align-items:center">
        <div style="width:54px;height:54px;border-radius:50%;background:var(--grad-navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.2rem">RK</div>
        <div><b>Ravi Kumar</b><br><span style="font-size:.85rem;color:var(--ink-muted)">Phlebotomist · VD-104 · ⭐ 4.9</span></div>
      </div>
      <div style="display:flex;gap:.6rem;margin-top:1rem">
        <a class="btn btn-primary btn-sm" href="tel:+919000011580">Call collector</a>
        <a class="btn btn-ghost btn-sm" href="#" onclick="toast('OTP sent: demo code 4821');return false">Resend OTP</a>
      </div>
    </div>
    <div class="card">
      <h3>Visit details</h3>
      <ul style="list-style:none;padding:0;line-height:2;font-size:.92rem" id="visitDetails"></ul>
    </div>
  </div>
</main>

<div id="chrome-fab"></div>
<div id="chrome-bottom"></div>
<div id="chrome-footer"></div>
<script src="assets/js/app.js"></script>
<script>
mountChrome('Home');

const STAGES = ['Collector Assigned','On the way','Arrived','Sample Collected','Processing','Report Ready'];
let stageIdx = 1; /* collector assigned, on the way next */

const bk = JSON.parse(localStorage.getItem('vd_last_booking')||'null');
document.getElementById('bkMeta').textContent = bk
  ? `Booking ${bk.id} · ${bk.items.map(i=>i.name).join(', ')} · ${fmtINR(bk.total)}`
  : 'Demo booking · CBC + HbA1c · Home collection';

function render(){
  document.getElementById('flow').innerHTML =
    STAGES.map((s,i)=>{
      const cls = i < stageIdx ? 'done' : i === stageIdx ? 'now' : '';
      return `${i? `<div class="tlink ${i<=stageIdx?'done':''}"></div>`:''}
        <div class="tnode ${cls}"><div class="bubble">${i<stageIdx?'✓':i+1}</div><span>${s}</span></div>`;
    }).join('');
  const det = [
    ['Address', bk?.addr || 'Flat 302, Sai Enclave, Kavadiguda'],
    ['Slot', `${bk?.date || new Date(Date.now()+864e5).toISOString().slice(0,10)} · ${bk?.slot || '7–8 AM'}`],
    ['Patient', bk?.member || 'Self'],
    ['Payment', bk ? fmtINR(bk.total) : '₹900 · Paid via UPI'],
  ];
  document.getElementById('visitDetails').innerHTML = det.map(([k,v])=>`<li><span style="color:var(--ink-faint)">${k}:</span> <b>${v}</b></li>`).join('');
}
render();

/* Simulated real-time progression (demo) — 12s per stage */
setInterval(()=>{ if (stageIdx < STAGES.length-1){ stageIdx++; render(); toast('Status updated: '+STAGES[stageIdx]);
  if(STAGES[stageIdx]==='Report Ready'){ clearInterval(); setTimeout(()=>location.href='report-insights.html',1500); } } }, 12000);
</script>
</body>
</html>
